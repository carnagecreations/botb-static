<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Beauties of the Beasts Reptile Rescue">
  <defs>
    <clipPath id="inner-clip">
      <circle cx="100" cy="100" r="80"/>
    </clipPath>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="99" fill="#b8975a"/>
  <!-- Dark teal band -->
  <circle cx="100" cy="100" r="94" fill="#1a5248"/>
  <!-- Inner cream ring -->
  <circle cx="100" cy="100" r="87" fill="#e8dfc8"/>
  <!-- Inner teal disc -->
  <circle cx="100" cy="100" r="81" fill="#1a5248"/>

  <!-- Top arc path for "BEAUTIES of the BEASTS" -->
  <path id="top-arc" d="M 18,100 A 82,82 0 0,1 182,100" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="12.5" fill="#e8dfc8" letter-spacing="1.5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">BEAUTIES of the BEASTS</textPath>
  </text>

  <!-- Bottom arc path for "· REPTILE RESCUE ·" -->
  <path id="bottom-arc" d="M 24,112 A 82,82 0 0,0 176,112" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="11.5" fill="#e8dfc8" letter-spacing="2.5">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">· REPTILE RESCUE ·</textPath>
  </text>

  <!-- Left olive branch -->
  <g transform="translate(33,78)">
    <path d="M 6,28 Q 4,18 8,8 Q 10,3 14,0" fill="none" stroke="#4a7a3a" stroke-width="1.2"/>
    <ellipse cx="5" cy="22" rx="5.5" ry="2.8" fill="#5a8a4a" transform="rotate(-40 5 22)"/>
    <ellipse cx="7" cy="15" rx="5.5" ry="2.8" fill="#5a8a4a" transform="rotate(-25 7 15)"/>
    <ellipse cx="10" cy="8" rx="5.5" ry="2.8" fill="#5a8a4a" transform="rotate(-10 10 8)"/>
    <ellipse cx="14" cy="2" rx="4.5" ry="2.5" fill="#4a7a3a" transform="rotate(10 14 2)"/>
  </g>

  <!-- Right olive branch (mirrored) -->
  <g transform="translate(167,78) scale(-1,1)">
    <path d="M 6,28 Q 4,18 8,8 Q 10,3 14,0" fill="none" stroke="#4a7a3a" stroke-width="1.2"/>
    <ellipse cx="5" cy="22" rx="5.5" ry="2.8" fill="#5a8a4a" transform="rotate(-40 5 22)"/>
    <ellipse cx="7" cy="15" rx="5.5" ry="2.8" fill="#5a8a4a" transform="rotate(-25 7 15)"/>
    <ellipse cx="10" cy="8" rx="5.5" ry="2.8" fill="#5a8a4a" transform="rotate(-10 10 8)"/>
    <ellipse cx="14" cy="2" rx="4.5" ry="2.5" fill="#4a7a3a" transform="rotate(10 14 2)"/>
  </g>

  <!-- Coiled ball python — outer body dark -->
  <path d="M 100,138 C 68,138 50,120 52,100 C 54,80 72,70 92,74 C 112,78 126,96 122,114 C 118,130 102,136 88,130 C 74,124 68,108 74,96 C 80,84 96,80 108,86 C 118,92 122,104 116,114"
    fill="none" stroke="#1e4a1e" stroke-width="15" stroke-linecap="round"/>

  <!-- Mid green layer -->
  <path d="M 100,138 C 68,138 50,120 52,100 C 54,80 72,70 92,74 C 112,78 126,96 122,114 C 118,130 102,136 88,130 C 74,124 68,108 74,96 C 80,84 96,80 108,86 C 118,92 122,104 116,114"
    fill="none" stroke="#3a6e3a" stroke-width="10" stroke-linecap="round"/>

  <!-- Scale saddle patches -->
  <ellipse cx="84" cy="136" rx="9" ry="5" fill="#1e4a1e" opacity="0.9" transform="rotate(-10 84 136)"/>
  <ellipse cx="64" cy="120" rx="8" ry="5" fill="#1e4a1e" opacity="0.9" transform="rotate(20 64 120)"/>
  <ellipse cx="58" cy="100" rx="8" ry="4.5" fill="#1e4a1e" opacity="0.85" transform="rotate(5 58 100)"/>
  <ellipse cx="68" cy="80" rx="7" ry="4" fill="#1e4a1e" opacity="0.85" transform="rotate(-20 68 80)"/>
  <ellipse cx="90" cy="72" rx="8" ry="4" fill="#1e4a1e" opacity="0.85"/>
  <ellipse cx="112" cy="78" rx="7" ry="4" fill="#1e4a1e" opacity="0.85" transform="rotate(15 112 78)"/>
  <ellipse cx="124" cy="96" rx="7" ry="4" fill="#1e4a1e" opacity="0.85" transform="rotate(30 124 96)"/>
  <ellipse cx="118" cy="116" rx="7" ry="4" fill="#1e4a1e" opacity="0.85" transform="rotate(10 118 116)"/>
  <ellipse cx="100" cy="130" rx="7" ry="4" fill="#1e4a1e" opacity="0.85"/>

  <!-- Cream highlights between saddles -->
  <path d="M 100,138 C 68,138 50,120 52,100 C 54,80 72,70 92,74 C 112,78 126,96 122,114 C 118,130 102,136 88,130 C 74,124 68,108 74,96 C 80,84 96,80 108,86 C 118,92 122,104 116,114"
    fill="none" stroke="#c8b870" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5,12" opacity="0.5"/>

  <!-- Snake head -->
  <ellipse cx="113" cy="112" rx="10" ry="7" fill="#1e4a1e" transform="rotate(30 113 112)"/>
  <ellipse cx="113" cy="112" rx="8" ry="5.5" fill="#3a6e3a" transform="rotate(30 113 112)"/>
  <ellipse cx="113" cy="112" rx="4" ry="3" fill="#1e4a1e" opacity="0.7" transform="rotate(30 113 112)"/>
  <!-- Eye -->
  <circle cx="108" cy="108" r="2.2" fill="#111"/>
  <circle cx="108.6" cy="107.4" r="0.7" fill="#7aaa3a" opacity="0.8"/>
  <!-- Nostril -->
  <circle cx="105" cy="111" r="0.9" fill="#163a16"/>
</svg>
